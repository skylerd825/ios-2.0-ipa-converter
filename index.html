<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS 2.0 IPA Converter & Downloader</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header>
        <img src="assets/logo.svg" alt="App Logo" width="50">
        <h1>iOS 2.0 IPA Converter</h1>
    </header>
    <main>
        <p>Convert and download historical iOS 2.0 applications (IPAs) for archival and emulator compatibility.</p>
        <div class="converter-box">
            <input type="file" id="ipa-file" accept=".ipa">
            <button id="convert-btn">Convert IPA</button>
        </div>
        <div id="status"></div>
    </main>
    <script src="assets/app.js"></script>
</body>
</html>
